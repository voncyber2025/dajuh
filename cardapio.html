<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#8a0d23">
<title>Cardápio Digital · Da Juh Bolos e Doces</title>
<meta name="description" content="Monte sua encomenda de bolo e doces da Da Juh.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#fde4ea;font-family:Nunito,system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
.topo{background:radial-gradient(circle at 50% 0%,#c8173a,#8a0d23 70%);color:#fff;text-align:center;padding:18px 16px 26px;position:relative;overflow:hidden}
.topo::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:linear-gradient(90deg,transparent,#e9c46a,transparent)}
.logo{width:120px;height:120px;border-radius:50%;background:#fff;display:grid;place-items:center;margin:0 auto 8px;box-shadow:0 0 0 3px #e9c46a,0 8px 24px rgba(0,0,0,.25)}
.logo img{width:92%;height:92%;object-fit:contain}
.topo h1{font-family:"Dancing Script",cursive;font-size:38px;margin:0;line-height:1.1;color:#f6d98a}
.topo p{margin:4px 0 0;font-size:13.5px;opacity:.9}
main{max-width:760px;margin:-10px auto 0;padding:0 10px 20px;position:relative}
.rodape{text-align:center;font-size:12.5px;color:#8b6b72;padding:10px 16px 100px;line-height:1.6}
.rodape b{color:#b3122e}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#3a1d24;color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;font-weight:700;z-index:60;max-width:90vw;text-align:center}
.hidden{display:none}
.cd-nav{background:#fde4ea}
/* ============ CARDÁPIO DIGITAL (montar pedido) ============ */
.cd{--cd-v:#b3122e;--cd-ve:#7d0a1f;--cd-ouro:#c9962b;--cd-creme:#fff8f3;--cd-linha:#f1d6dd;--cd-suave:#8b6b72;--cd-txt:#3a1d24;color:var(--cd-txt);display:grid;gap:12px;padding-bottom:84px}
.cd-sec{background:#fff;border-radius:16px;box-shadow:0 2px 12px rgba(139,13,35,.08);padding:14px 14px 16px;scroll-margin-top:110px;position:relative}
.cd-sec h2{margin:0 0 8px;font-size:19px;color:var(--cd-v);display:flex;align-items:center;gap:6px}
.cd-sub{margin:-2px 0 8px;font-size:13px;color:var(--cd-suave)}
.cd-campo{display:grid;gap:4px;font-size:13px;font-weight:700;color:var(--cd-suave);margin-bottom:10px}
.cd-campo input,.cd-campo textarea{width:100%;border:1px solid var(--cd-linha);background:var(--cd-creme);border-radius:12px;padding:11px 12px;font:inherit;font-size:15px;color:var(--cd-txt);outline:0;box-sizing:border-box}
.cd-campo input:focus,.cd-campo textarea:focus{border-color:var(--cd-v)}
.cd-g2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.cd-nav{position:sticky;top:var(--cd-topo,0px);z-index:15;display:flex;gap:6px;overflow-x:auto;padding:8px 2px;background:inherit;scrollbar-width:none;margin:-4px 0}
.cd-nav::-webkit-scrollbar{display:none}
.cd-nav button{flex:0 0 auto;border:1px solid var(--cd-linha);background:#fff;border-radius:999px;padding:8px 13px;font:inherit;font-size:13px;font-weight:800;color:var(--cd-v);white-space:nowrap;box-shadow:0 2px 6px rgba(139,13,35,.06);cursor:pointer}
.cd-passo{display:flex;justify-content:space-between;align-items:baseline;margin:12px 0 6px;font-size:14px}
.cd-passo span{font-size:12px;color:var(--cd-suave);font-weight:700}
.cd-rot{font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--cd-suave);margin:8px 0 5px}
.cd-linha{display:flex;flex-wrap:wrap;gap:6px}
.cd-chip{border:1px solid var(--cd-linha);background:var(--cd-creme);border-radius:999px;padding:8px 12px;font:inherit;font-size:13.5px;font-weight:700;color:var(--cd-txt);cursor:pointer}
.cd-chip.on{background:var(--cd-v);border-color:var(--cd-v);color:#fff}
.cd-grade{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.cd-op{border:1px solid var(--cd-linha);background:var(--cd-creme);border-radius:12px;padding:9px 4px;font:inherit;display:grid;gap:2px;justify-items:center;text-align:center;cursor:pointer;color:var(--cd-txt)}
.cd-op b{font-size:13.5px}
.cd-op span{font-size:12px;color:var(--cd-v);font-weight:800}
.cd-op.on{background:var(--cd-v);border-color:var(--cd-v);color:#fff}
.cd-op.on span{color:#fff}
.cd-add{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px;padding-top:12px;border-top:1px dashed var(--cd-linha)}
.cd-preco{font-size:18px;font-weight:800;color:var(--cd-v)}
.cd-alerta{color:#b86e00;font-weight:800}
.cd-btn{border:0;border-radius:12px;padding:12px 16px;font:inherit;font-weight:800;font-size:15px;background:var(--cd-v);color:#fff;cursor:pointer;text-decoration:none;display:inline-block;text-align:center}
.cd-btn:disabled{opacity:.6}
.cd-btn.sec{background:#fff;color:var(--cd-v);border:1px solid var(--cd-linha)}
.cd-un{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 0;border-bottom:1px solid var(--cd-linha)}
.cd-un:last-child{border-bottom:0}
.cd-un b{display:block;font-size:14px;text-transform:capitalize}
.cd-un span{font-size:12px;color:var(--cd-v);font-weight:800}
.cd-step{display:flex;align-items:center;gap:4px;flex:0 0 auto}
.cd-step button{width:34px;height:34px;border-radius:10px;border:0;background:#fde0e5;color:var(--cd-v);font:inherit;font-weight:800;font-size:18px;cursor:pointer}
.cd-step button.mini{width:38px;font-size:12px;background:var(--cd-creme);border:1px solid var(--cd-linha)}
.cd-step input{width:48px;text-align:center;border:1px solid var(--cd-linha);border-radius:10px;padding:7px 2px;font:inherit;font-weight:800;font-size:15px;background:#fff;color:var(--cd-txt)}
.cd-rcat{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--cd-ouro);margin:10px 0 2px}
.cd-ritem{display:flex;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--cd-linha)}
.cd-ritem>div:first-child{flex:1;min-width:0}
.cd-ritem b{display:block;font-size:14px}
.cd-ritem span{display:block;font-size:12px;color:var(--cd-suave)}
.cd-rv{font-weight:800;white-space:nowrap;font-size:14px}
.cd-x{border:0;background:transparent;color:var(--cd-suave);font-size:16px;padding:6px;cursor:pointer}
.cd-vazio{color:var(--cd-suave);text-align:center;margin:10px 0}
.cd-total{display:flex;justify-content:space-between;align-items:baseline;margin:12px 0 6px;font-size:15px}
.cd-total b{font-size:24px;color:var(--cd-v)}
.cd-aviso{background:#fff1d6;color:#8a5200;border-radius:12px;padding:10px 12px;font-size:13.5px;margin:6px 0}
.cd-regras{background:var(--cd-creme);border-radius:12px;padding:10px 12px;font-size:13px;display:grid;gap:2px;margin:8px 0 12px}
.cd-mini{font-size:11.5px;color:var(--cd-suave)}
.cd-erro{color:#c01f3a;font-weight:800;font-size:14px;min-height:4px;margin-bottom:6px}
.cd-enviar{width:100%;font-size:17px;padding:15px}
.cd-barra{position:fixed;left:10px;right:10px;bottom:calc(var(--cd-baixo,10px) + env(safe-area-inset-bottom));z-index:40;display:flex;justify-content:space-between;align-items:center;border:0;border-radius:16px;padding:14px 16px;background:var(--cd-v);color:#fff;font:inherit;font-weight:800;font-size:15px;box-shadow:0 6px 20px rgba(139,13,35,.35);cursor:pointer;max-width:760px;margin:0 auto}
.cd-oculta{display:none}
.cd-ok{text-align:center;display:grid;gap:10px;justify-items:center;padding:28px 16px}
.cd-ok p{margin:0}
.cd-ok .cd-btn{width:100%;max-width:360px}
.cd-whats{background:#1f9d55!important}
@media (min-width:820px){
  .cd-grade{grid-template-columns:repeat(5,1fr)}
  .cd-grade.tres{grid-template-columns:repeat(3,1fr)}
}
</style>
</head>

const STATUS_ENCOMENDA = {
  novo: "Novo",
  confirmado: "Confirmado",
  sinal: "Sinal pago",
  entregue: "Entregue",
  cancelado: "Cancelado",

const cTxt = (v, max = 120) => String(v ?? "").replace(/\s+/g, " ").trim().slice(0, max);
const arred = (v) => Math.round(v * 100) / 100;

// Recebe os itens escolhidos e devolve os itens com nome, detalhe, categoria e preço.
// Itens "a consultar" ficam com preco = null e consultar = true.
function calcularPedido(brutos) {
  const C = CARDAPIO, itens = [];
  if (!Array.isArray(brutos) || !brutos.length) throw new Error("Escolha pelo menos um item do cardápio");
  if (brutos.length > 40) throw new Error("Pedido grande demais");
  for (const b of brutos) {
    if (b.tipo === "bolo" || b.tipo === "kit") {
      const rec = (b.recheios || []).map((r) => cTxt(r)).filter(Boolean);
      const validos = b.tipo === "kit" ? C.bolo.recheiosTradicionais : [...C.bolo.recheiosTradicionais, ...C.bolo.recheiosEspeciais];
      if (rec.length !== 2 || !rec.every((r) => validos.includes(r))) throw new Error(b.tipo === "kit" ? "Escolha 2 recheios tradicionais para o bolo do kit" : "Escolha 2 recheios para o bolo");
      if (!C.bolo.massas.includes(b.massa)) throw new Error("Escolha a massa do bolo");
      if (b.tipo === "kit") {
        if (!C.doces.tradicional.sabores.includes(b.docinho)) throw new Error("Escolha o sabor dos docinhos do kit");
        itens.push({ cat: "Kit Festa", nome: "Kit Festa", detalhe: `Bolo 15 pessoas (massa ${b.massa.toLowerCase()}; ${rec.join(" + ")}) · 25 docinhos de ${b.docinho.toLowerCase()} · 100 salgadinhos · vela de brinde`, qtd: 1, preco: C.kit.preco, consultar: false });
        continue;
      }
      const t = C.bolo.tamanhos.find((x) => x.id === String(b.tamanho));
      if (!t) throw new Error("Escolha o tamanho do bolo");
      const especial = rec.some((r) => C.bolo.recheiosEspeciais.includes(r));
      itens.push({ cat: "Bolo", nome: `Bolo ${t.nome}${especial ? " (sabor especial)" : ""}`, detalhe: `Massa ${b.massa.toLowerCase()} · ${rec.join(" + ")} · 3 camadas`, qtd: 1, preco: especial ? null : t.tradicional, consultar: especial });
    } else if (b.tipo === "doces") {
      const linha = C.doces[b.linha];
      if (!linha) throw new Error("Linha de doces inválida");
      const pac = linha.pacotes.find((p) => p.qtd === Number(b.pacote));
      if (!pac) throw new Error("Escolha a quantidade de doces");
      const sab = (b.sabores || []).map((s) => cTxt(s)).filter(Boolean);
      if (sab.length !== pac.sabores || !sab.every((s) => linha.sabores.includes(s)) || new Set(sab).size !== sab.length) throw new Error(`Escolha ${pac.sabores} sabor(es) diferentes para ${pac.qtd} ${linha.nome.toLowerCase()}`);
      itens.push({ cat: linha.nome, nome: `${pac.qtd} ${linha.nome.toLowerCase()}`, detalhe: sab.join(", "), qtd: 1, preco: pac.preco, consultar: false });
    } else if (b.tipo === "unid") {
      const u = C.unidades.find((x) => x.id === b.id);
      const q = Math.floor(Number(b.qtd));
      if (!u || !(q > 0) || q > 2000) throw new Error("Quantidade inválida");
      itens.push({ cat: u.cat, nome: u.nome, detalhe: "", qtd: q, preco: arred(u.preco * q), consultar: false });
    } else throw new Error("Item inválido");
  }
  const total = arred(itens.reduce((s, i) => s + (i.preco || 0), 0));
  return { itens, total, consultar: itens.some((i) => i.consultar) };
}

function hojeISO() {
  const d = new Date(Date.now() - 3 * 3600e3); // horário de Brasília
  return d.toISOString().slice(0, 10);
}

// Valida os dados do cliente + itens e devolve a encomenda pronta para guardar
function montarEncomenda(p, origem) {
  const festa = String(p.festa || "");
  if (!/^\d{4}-\d{2}-\d{2}$/.test(festa)) throw new Error("Informe a data da festa");
  if (origem === "cliente" && festa < hojeISO()) throw new Error("A data da festa já passou");
  const nome = cTxt(p.nome, 80), telefone = cTxt(p.telefone, 30).replace(/[^\d()+\s-]/g, "");
  if (!nome) throw new Error("Informe o nome");
  if (telefone.replace(/\D/g, "").length < 10) throw new Error("Informe o telefone com DDD");
  const calc = calcularPedido(p.itens);
  return {
    festa, horario: cTxt(p.horario, 10), tema: cTxt(p.tema, 80), nome, telefone, bairro: cTxt(p.bairro, 60),
    pagamento: CARDAPIO.pagamentos.includes(p.pagamento) ? p.pagamento : "",
    obs: cTxt(p.obs, 500), itens: calc.itens, total: calc.total, consultar: calc.consultar,
  };
}

// Operações das encomendas (chamadas pelo servidor)
function aplicarEncomenda(e, op) {
  e.encomendas = e.encomendas || [];
  const agora = new Date().toISOString();
  const achar = (id) => { const x = e.encomendas.find((k) => k.id === id); if (!x) throw new Error("Encomenda não encontrada"); return x; };
  switch (op.tipo) {
    case "novaEncomenda": {
      const origem = op.origem === "cliente" ? "cliente" : "sistema";
      const dados = montarEncomenda(op.pedido || {}, origem);
      const numero = (e.encomendas.reduce((m, k) => Math.max(m, k.numero || 0), 0) || 0) + 1;
      const nova = { id: Date.now().toString(36) + Math.random().toString(36).slice(2, 7), numero, criadoEm: agora, origem, ...dados, status: "novo", valorCombinado: null, sinalPago: null, nota: "", historico: [{ em: agora, txt: origem === "cliente" ? "Pedido feito pelo cliente no cardápio digital" : "Pedido lançado no sistema" }] };
      e.encomendas.push(nova);
      return nova;
    }
    case "statusEncomenda": {
      const k = achar(op.id);
      if (!STATUS_ENCOMENDA[op.status]) throw new Error("Situação inválida");
      k.status = op.status;
      if (op.status === "sinal" && op.sinal != null && !isNaN(Number(op.sinal))) k.sinalPago = arred(Number(op.sinal));
      k.historico.push({ em: agora, txt: "Situação: " + STATUS_ENCOMENDA[op.status] });
      break;
    }
    case "editarEncomenda": {
      const k = achar(op.id);
      if (op.valorCombinado !== undefined) {
        const v = op.valorCombinado === null || op.valorCombinado === "" ? null : Number(op.valorCombinado);
        if (v !== null && (isNaN(v) || v < 0)) throw new Error("Valor inválido");
        k.valorCombinado = v === null ? null : arred(v);
      }
      if (op.sinalPago !== undefined) {
        const v = op.sinalPago === null || op.sinalPago === "" ? null : Number(op.sinalPago);
        if (v !== null && (isNaN(v) || v < 0)) throw new Error("Valor do sinal inválido");
        k.sinalPago = v === null ? null : arred(v);
      }
      if (op.nota !== undefined) k.nota = cTxt(op.nota, 500);
      if (op.festa !== undefined) { if (!/^\d{4}-\d{2}-\d{2}$/.test(op.festa)) throw new Error("Data inválida"); k.festa = op.festa; }
      if (op.horario !== undefined) k.horario = cTxt(op.horario, 10);
      k.historico.push({ em: agora, txt: "Encomenda atualizada" });
      break;
    }
    case "apagarEncomenda":
      e.encomendas = e.encomendas.filter((k) => k.id !== op.id);
      break;
    default:
      return undefined;
  }
  return true;
}

function textoPedido(enc, paraCliente) {
  const L = [];
  L.push(paraCliente ? `Olá, ${enc.nome}! Aqui é a Juliana, da Da Juh 🎂 Seguem os dados da sua encomenda:` : `Olá, Juliana! Fiz um pedido pelo Cardápio Digital 🎂`);
  L.push("");
  if (enc.numero) L.push(`*Pedido nº ${enc.numero}*`);
  L.push(`📅 Festa: ${cdData(enc.festa)} (${cdSemana(enc.festa)})${enc.horario ? " · retirada às " + enc.horario : ""}`);
  if (enc.tema) L.push(`🎈 Tema: ${enc.tema}`);
  L.push(`👤 ${enc.nome} · ${enc.telefone}${enc.bairro ? " · " + enc.bairro : ""}`);
  L.push("");
  const cats = [...new Set(enc.itens.map((i) => i.cat))];
  for (const c of cats) {
    L.push(`*${c}*`);
    for (const i of enc.itens.filter((x) => x.cat === c))
      L.push(`• ${i.qtd > 1 ? i.qtd + "x " : ""}${i.nome}${i.detalhe ? " – " + i.detalhe : ""}: ${i.consultar ? "⚠️ a consultar" : cdBRL(i.preco)}`);
  }
  L.push("");
  const total = enc.valorCombinado != null ? enc.valorCombinado : enc.total;
  L.push(`*Total${enc.valorCombinado == null && enc.consultar ? " (sem os itens a consultar)" : ""}: ${cdBRL(total)}*`);
  if (enc.valorCombinado == null && enc.consultar) L.push("⚠️ Alguns itens têm valor a consultar.");
  if (paraCliente && total) L.push(`Sinal de 50%: ${cdBRL(Math.round(total * 50) / 100)}`);
  if (enc.pagamento) L.push(`💳 Pagamento: ${enc.pagamento}`);
  if (enc.obs) L.push(`📝 ${enc.obs}`);
  return L.join("\n");
}

        <div class="cd-g2">
          <label class="cd-campo">Telefone (WhatsApp) *<input type="tel" id="cd-telefone" maxlength="30" inputmode="tel" autocomplete="tel" placeholder="(21) 90000-0000" value="${cdEsc(dados.telefone)}"></label>
          <label class="cd-campo">Bairro<input type="text" id="cd-bairro" maxlength="60" value="${cdEsc(dados.bairro)}"></label>
        </div>
      </div>
      <nav class="cd-nav">${CD_CATS.map((c) => `<button type="button" data-ir-cat="${c.id}">${c.ic} ${c.nome}</button>`).join("")}</nav>
      ${htmlBolo()}${htmlDoces("tradicional")}${htmlDoces("gourmet")}
      ${htmlUnid("Brownie", "🍫")}${htmlUnid("Cupcake", "🧁", '<p class="cd-sub">Pequeno R$ 3,50 · Grande R$ 5,00</p>')}${htmlUnid("Bem casado", "💝", '<p class="cd-sub">Tamanho 6x6cm</p>')}
      ${htmlKit()}${htmlResumo()}
      <button type="button" class="cd-barra${n ? "" : " cd-oculta"}" data-acao="verResumo"><span>🛒 ${n} ${n === 1 ? "item" : "itens"}</span><span>${cdBRL(r.total)}${r.consultar ? " ⚠️" : ""} · Ver pedido ›</span></button>
    </div>`;
    salvarRascunho();
  }
  function lerDados() {
    for (const k of ["festa", "horario", "tema", "nome", "telefone", "bairro"]) { const i = $c("#cd-" + k); if (i) dados[k] = i.value; }
    const o = $c("#cd-obs"); if (o) dados.obs = o.value;
  }
  function manterRolagem(fn) { const y = window.scrollY; fn(); window.scrollTo(0, y); }
  function aviso(msg) { if (opcoes.aviso) opcoes.aviso(msg); else alert(msg); }
  const alternar = (lista, v, max) => { const i = lista.indexOf(v); if (i >= 0) lista.splice(i, 1); else if (lista.length < max) lista.push(v); else { lista.shift(); lista.push(v); } };

  raiz.addEventListener("input", (e) => {
    if (e.target.dataset.unq) { const q = Math.max(0, Math.floor(Number(e.target.value) || 0)); unid[e.target.dataset.unq] = q; lerDados(); salvarRascunho(); atualizarBarra(); return; }
    lerDados(); salvarRascunho();
  });
  raiz.addEventListener("change", (e) => { if (e.target.dataset.unq) manterRolagem(render); });
  function atualizarBarra() {
    const r = calc(), n = r.itens.reduce((s, i) => s + (i.cat === "Brownie" || i.cat === "Cupcake" || i.cat === "Bem casado" ? i.qtd : 1), 0);
    const b = $c(".cd-barra"); if (!b) return;
    b.classList.toggle("cd-oculta", !n);
    b.innerHTML = `<span>🛒 ${n} ${n === 1 ? "item" : "itens"}</span><span>${cdBRL(r.total)}${r.consultar ? " ⚠️" : ""} · Ver pedido ›</span>`;
  }

  raiz.addEventListener("click", async (e) => {
    const t = e.target.closest("button"); if (!t || !raiz.contains(t)) return;
    const d = t.dataset; lerDados();
    if (d.irCat) { const alvo = d.irCat === "bolo" ? "#cd-bolo" : d.irCat === "kit" ? "#cd-kit" : d.irCat === "tradicional" || d.irCat === "gourmet" ? "#cd-" + d.irCat : "#cd-" + d.irCat.replace(" ", "-"); $c(alvo).scrollIntoView({ behavior: "smooth", block: "start" }); return; }
    if (d.acao === "verResumo") { $c("#cd-resumo").scrollIntoView({ behavior: "smooth", block: "start" }); return; }
    const muda = () => manterRolagem(render);
    if (d.tam) { sel.tamanho = d.tam; return muda(); }
    if (d.massa) { sel.massa = d.massa; return muda(); }
    if (d.rec) { alternar(sel.recheios, d.rec, 2); return muda(); }
    if (d.kmassa) { sel.kitMassa = d.kmassa; return muda(); }
    if (d.krec) { alternar(sel.kitRecheios, d.krec, 2); return muda(); }
    if (d.kdoc) { sel.kitDocinho = d.kdoc; return muda(); }
    if (d.pag) { dados.pagamento = dados.pagamento === d.pag ? "" : d.pag; return muda(); }
    if (d.pac) { const [l, q] = d.pac.split(":"); const s = sel[l === "tradicional" ? "trad" : "gourmet"]; s.pacote = Number(q); const max = C.doces[l].pacotes.find((p) => p.qtd === s.pacote).sabores; s.sabores = s.sabores.slice(0, max); return muda(); }
    for (const l of ["tradicional", "gourmet"]) if (d[l === "tradicional" ? "sabTradicional" : "sabGourmet"] !== undefined) {
      const s = sel[l === "tradicional" ? "trad" : "gourmet"]; const max = C.doces[l].pacotes.find((p) => p.qtd === s.pacote).sabores;
      alternar(s.sabores, d[l === "tradicional" ? "sabTradicional" : "sabGourmet"], max); return muda();
    }
    if (d.un) { unid[d.un] = Math.max(0, (unid[d.un] || 0) + Number(d.d)); return muda(); }
    if (d.rem) { const [k, v] = d.rem.split(":"); if (k === "u") delete unid[v]; else entradas.splice(Number(v), 1); return muda(); }
    if (d.acao === "addBolo") {
      const item = { tipo: "bolo", tamanho: sel.tamanho, massa: sel.massa, recheios: [...sel.recheios] };
      try { calcularPedido([item]); } catch (err) { return aviso(err.message); }
      entradas.push(item); sel.tamanho = ""; sel.massa = ""; sel.recheios = []; aviso("Bolo adicionado ao pedido 🎂"); return muda();
    }
    if (d.acao === "addDoces") {
      const s = sel[d.linha === "tradicional" ? "trad" : "gourmet"];
      const item = { tipo: "doces", linha: d.linha, pacote: s.pacote, sabores: [...s.sabores] };
      try { calcularPedido([item]); } catch (err) { return aviso(err.message); }
      entradas.push(item); s.sabores = []; aviso("Doces adicionados ao pedido"); return muda();
    }
    if (d.acao === "addKit") {
      const item = { tipo: "kit", massa: sel.kitMassa, recheios: [...sel.kitRecheios], docinho: sel.kitDocinho };
      try { calcularPedido([item]); } catch (err) { return aviso(err.message); }
      entradas.push(item); sel.kitMassa = ""; sel.kitRecheios = []; sel.kitDocinho = ""; aviso("Kit Festa adicionado 🎉"); return muda();
    }
    if (d.acao === "enviar") {
      const erroEl = $c("#cd-erro"); erroEl.textContent = "";
      const falta = !dados.festa ? "Informe a data da festa" : !dados.nome.trim() ? "Informe o nome do cliente" : dados.telefone.replace(/\D/g, "").length < 10 ? "Informe o telefone com DDD" : !itensBrutos().length ? "Escolha pelo menos um item do cardápio" : "";
      if (falta) { erroEl.textContent = falta; if (!itensBrutos().length) return; $c("#cd-dados").scrollIntoView({ behavior: "smooth" }); return; }
      t.disabled = true; t.textContent = "Enviando…";
      try {
        const enc = await opcoes.enviar({ ...dados, itens: itensBrutos() }, $c("#cd-site").value);
        limparRascunho(); entradas = []; unid = {}; dados = { festa: "", horario: "", tema: "", nome: "", telefone: "", bairro: "", pagamento: "", obs: "" };
        sucesso(enc);
      } catch (err) { erroEl.textContent = err.message; t.disabled = false; t.textContent = modo === "cliente" ? "Enviar pedido" : "Salvar encomenda"; }
    }
  });

  function sucesso(enc) {
    const zap = modo === "cliente" ? linkWhats(WHATSAPP_JULIANA, textoPedido(enc, false)) : linkWhats(foneWhats(enc.telefone), textoPedido(enc, true));
    raiz.innerHTML = `<div class="cd"><div class="cd-sec cd-ok">
      <div style="font-size:54px">🎉</div>
      <h2>${modo === "cliente" ? "Pedido recebido!" : "Encomenda salva!"}</h2>
      <p>Pedido nº <b>${enc.numero}</b> · festa em <b>${cdData(enc.festa)}</b></p>
      ${enc.consultar ? '<div class="cd-aviso">⚠️ Tem itens com valor a consultar.' + (modo === "cliente" ? " A Juliana vai te passar o valor final." : "") + "</div>" : `<p>Total: <b>${cdBRL(enc.total)}</b></p>`}
      ${modo === "cliente" ? "<p>Para agilizar, envie o resumo para a Juliana no WhatsApp:</p>" : ""}
      <a class="cd-btn cd-whats" href="${zap}" target="_blank" rel="noopener">💬 ${modo === "cliente" ? "Enviar no WhatsApp da Juliana" : "Mandar resumo para o cliente"}</a>
      <button type="button" class="cd-btn sec" data-acao="novo">${modo === "cliente" ? "Fazer outro pedido" : "Lançar outra encomenda"}</button>
      ${opcoes.depois ? '<button type="button" class="cd-btn sec" data-acao="depois">Ver encomendas agendadas</button>' : ""}
    </div></div>`;
    raiz.querySelector("[data-acao=novo]").onclick = () => { render(); window.scrollTo(0, 0); };
    if (opcoes.depois) raiz.querySelector("[data-acao=depois]").onclick = opcoes.depois;
    window.scrollTo(0, 0);
    if (modo === "cliente") setTimeout(() => { try { window.location.href = zap; } catch {} }, 900);
  }

  render();
  return { reiniciar() { entradas = []; unid = {}; render(); } };
}

function toast(msg) {
  const t = document.getElementById("toast"); t.textContent = msg; t.classList.remove("hidden");
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.add("hidden"), 2400);
}
montarCardapio(document.getElementById("raiz"), {
  modo: "cliente",
  aviso: toast,
  async enviar(pedido, site) {
    let r;
    try {
      r = await fetch("/api/pedido", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ pedido, site }) });
    } catch { throw new Error("Sem conexão. Confira a internet e tente de novo."); }
    const j = await r.json().catch(() => ({}));
    if (!r.ok || !j.ok) throw new Error(j.erro || "Não foi possível enviar. Chame a Juliana no WhatsApp.");
    return j.encomenda;
  },
});
</script>
</body>
</html>
